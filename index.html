<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Claim Reward</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: linear-gradient(rgba(17, 19, 25, 0.85), rgba(17, 19, 25, 0.85)), url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .container { display: flex; gap: 20px; max-width: 900px; width: 100%; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
        .card { background: rgba(28, 30, 39, 0.95); border-radius: 14px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.03); backdrop-filter: blur(5px); }
        .side-card { flex: 1; min-width: 290px; max-width: 350px; display: flex; flex-direction: column; height: 380px; }
        .main-card { flex: 2; min-width: 320px; max-width: 460px; text-align: center; }
        
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .subtitle { color: #8e9297; font-size: 13px; margin-bottom: 25px; }
        
        /* Ödül Seçim Alanı */
        .reward-grid { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .reward-item { background: #252836; border-radius: 10px; padding: 25px; flex: 1; cursor: pointer; border: 2px solid transparent; text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 160px; transition: transform 0.2s, border-color 0.2s; }
        .reward-item:hover { transform: translateY(-3px); border-color: #ff73fa; }
        .reward-item.robux-btn:hover { border-color: #dfb241; }
        .reward-icon-container { width: 65px; height: 55px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .reward-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .reward-desc { font-size: 11px; color: #b9bbbe; }
        
        /* SOHBET BAŞLIĞI YAPISI */
        .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2f3241; padding-bottom: 12px; margin-bottom: 15px; }
        .chat-title-wrapper { display: flex; align-items: center; gap: 10px; }
        
        .chat-icon-green { width: 32px; height: 32px; background: #00b06c; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .chat-icon-green svg { width: 16px; height: 16px; fill: #fff; }
        
        .chat-title-text h3 { font-size: 16px; font-weight: bold; color: #fff; }
        .chat-title-text p { font-size: 11px; color: #8e9297; margin-top: 1px; }
        .status { font-size: 12px; color: #23a55a; font-weight: bold; }
        
        /* Gerçekçi Kayma Efektli İçerik Alanı */
        .chat-box { height: 215px; overflow-y: hidden; display: flex; flex-direction: column; gap: 12px; font-size: 13px; text-align: left; padding: 5px; border-radius: 8px; background: rgba(0,0,0,0.1); flex-grow: 1; }
        .chat-msg { line-height: 1.4; animation: msgSlideUp 0.25s ease-out forwards; opacity: 0; }
        
        /* İsim Renkleri */
        .username-green { font-weight: bold; color: #00b06c; text-decoration: underline; }
        .username-lightgreen { font-weight: bold; color: #52b788; text-decoration: underline; }
        
        .claimed-robux { color: #00b06c; font-weight: 500; }
        .claimed-nitro { color: #ff73fa; font-weight: 500; }
        .user-text { color: #dcddde; margin-left: 3px; }
        
        @keyframes msgSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* SABİTLENEN MESAJ ALANI VE MOR SEND BUTONU */
        .chat-input-area { display: flex; gap: 8px; margin-top: auto; padding-top: 15px; border-top: 1px solid #2f3241; width: 100%; }
        .chat-input-area input { flex: 1; background: #252836; border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 13px; cursor: not-allowed; }
        .chat-input-area button { background: #5865F2; border: none; color: #fff; padding: 0 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: not-allowed; opacity: 0.8; display: flex; align-items: center; justify-content: center; }
        
        @media(max-width: 768px) { .container { flex-direction: column; align-items: center; } .side-card { max-width: 100%; width: 100%; } }
    </style>
</head>
<body>

                <div class="chat-title-text">
                    <h3>Live Chat</h3>

            </div>
            <div class="status">● <span id="activeCount">180</span> active</div>
        </div>
        
        <div class="chat-box" id="chatContainer">

        </div>

        <div class="chat-input-area">
            <input type="text" placeholder="Claim any prize to chat..." disabled="disabled" />
            <button disabled="disabled">Send</button>
        </div>
    </div>
</div>
